services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=serveflow
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d serveflow"]
      interval: 10s
      timeout: 5s
      retries: 8
    ports:
      - "5432:5432"

  redis:
    image: redis:alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 8
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    command: sh -c "python manage.py migrate && python manage.py collectstatic --noinput && daphne -b 0.0.0.0 -p 8000 serveflow.asgi:application"
    restart: unless-stopped
    volumes:
      - ./backend:/app
      - ./backend/media:/app/media
    environment:
      - DEBUG=0
      - SECRET_KEY=change-me-in-production
      - ALLOWED_HOSTS=localhost,127.0.0.1,backend
      - FRONTEND_URL=http://localhost
      - CORS_ALLOWED_ORIGINS=http://localhost,http://127.0.0.1
      - DATABASE_URL=postgres://postgres:postgres@db:5432/serveflow
      - REDIS_URL=redis://redis:6379/0
      - AI_SERVICE_URL=http://ai_service:8001
      - MATCHING_SERVICE_URL=http://matching_service:8002
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 8

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost/ >/dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 8

  ai_service:
    build: ./ai_service
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 8

  matching_service:
    build: ./matching_service
    restart: unless-stopped
    ports:
      - "8002:8002"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 8

volumes:
  postgres_data:
